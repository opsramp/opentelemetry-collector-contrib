apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcol-sa
  namespace: opsramp-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otelcol-role
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otelcol-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otelcol-role
subjects:
- kind: ServiceAccount
  name: otelcol-sa
  namespace: opsramp-agent